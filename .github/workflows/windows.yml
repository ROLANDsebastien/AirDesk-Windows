name: Installateur Windows

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Compiler pour Windows x64
        shell: pwsh
        run: |
          dotnet publish src/AirDesk.Companion.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Créer l’installateur
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/AirDesk.Companion.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag doit correspondre à la version $version."
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup absent du runner.' }
          & $iscc "/DAppVersion=$version" installer/AirDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier l’installation, la capture et le pont de l’extension
        shell: pwsh
        run: |
          node --check extension/background.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./installer/smoke-test.ps1 -Setup 'artifacts/installer/AirDesk-Companion-Windows-x64-Setup.exe'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AirDesk-Companion-Windows-x64-Setup
          path: artifacts/installer/AirDesk-Companion-Windows-x64-Setup.exe
          if-no-files-found: error
      - name: Publier la préversion GitHub
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = 'artifacts/installer/AirDesk-Companion-Windows-x64-Setup.exe'
          gh release create $env:GITHUB_REF_NAME $exe --verify-tag --prerelease --title "AirDesk Companion Windows $env:GITHUB_REF_NAME" --notes "Pilote Windows x64. Installeur autonome et non signé. Après installation, ouvrez AirDesk Companion, saisissez un code AirDesk et utilisez Activité et sites > Configurer l’extension Edge."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
