name: Installateur Windows

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Compiler pour Windows x64
        shell: pwsh
        run: |
          dotnet publish src/AirDesk.Companion.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Créer l’installateur
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/AirDesk.Companion.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag doit correspondre à la version $version."
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup absent du runner.' }
          & $iscc "/DAppVersion=$version" installer/AirDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier installation, démarrage, collecte et désinstallation
        shell: pwsh
        run: |
          $setup = Resolve-Path 'artifacts/installer/AirDesk-Companion-Windows-x64-Setup.exe'
          $install = Join-Path $env:LOCALAPPDATA 'Programs\AirDesk Companion'
          $journal = Join-Path $env:LOCALAPPDATA 'AirDesk Companion\journal.json'
          $result = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installation échouée ($($result.ExitCode))." }
          $process = Start-Process (Join-Path $install 'AirDeskCompanion.exe') -PassThru
          try {
            $state = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Le compagnon s’est arrêté ($($process.ExitCode))." }
              if ((Test-Path $journal) -and $process.MainWindowHandle -ne [IntPtr]::Zero) {
                $state = Get-Content $journal -Raw | ConvertFrom-Json
                if ($state.pending.Count -gt 0) { break }
              }
            }
            if (-not $state.installationId -or -not $state.latest.id -or $state.pending.Count -lt 1) {
              throw 'Aucune première observation locale détectée.'
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id; $process.WaitForExit() }
          }
          $result = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path (Join-Path $install 'AirDeskCompanion.exe'))) {
            throw 'Désinstallation échouée.'
          }
          if (-not (Test-Path $journal)) { throw 'Le journal local doit rester accessible après la désinstallation.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AirDesk-Companion-Windows-x64-Setup
          path: artifacts/installer/AirDesk-Companion-Windows-x64-Setup.exe
          if-no-files-found: error
      - name: Publier la préversion GitHub
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = 'artifacts/installer/AirDesk-Companion-Windows-x64-Setup.exe'
          gh release create $env:GITHUB_REF_NAME $exe --verify-tag --prerelease --title "AirDesk Companion Windows $env:GITHUB_REF_NAME" --notes "Pilote Windows x64. Installeur autonome et non signé. Après installation, ouvrez AirDesk Companion et saisissez un code généré dans AirDesk."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
